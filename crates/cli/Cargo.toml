[package]
name = "lenslet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lenslet-core = { path = "../core" }
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "logging", "native-tokio"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "sync", "time", "process", "signal"] }
