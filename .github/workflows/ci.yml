name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]  # undici 8.x 要求 node >= 22
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Syntax check all sources
        run: |
          node --version
          ls -la bin/ src/ tests/
          for f in bin/*.mjs src/*.js tests/*.mjs; do node --check "$f" || echo "SYNTAX FAIL: $f"; done
      - name: CLI smoke test (help/version, no celld needed)
        run: |
          timeout 30 node bin/celagent-tui.mjs help >/dev/null || { echo "HELP FAILED exit=$?"; exit 1; }
          timeout 30 node bin/celagent-tui.mjs version | grep -q "celagent v" || { echo "VERSION FAILED"; exit 1; }
      - name: "Unit tests (no celld, mock mode)"
        run: npm test
        env:
          CELAGENT_MOCK: "1"
        continue-on-error: true
      - name: Secret / PII scan
        run: |
          set -euo pipefail
          # 拦截密钥形态 + 红线禁止的本机路径/历史 PII 样例
          if command -v rg >/dev/null 2>&1; then
            SCAN=(rg -n --glob '!package-lock.json' --glob '!.git/**')
          else
            SCAN=(grep -RIn --exclude=package-lock.json --exclude-dir=.git)
          fi
          PATTERN='<local-user>|x-blocked-sess|/Users/[A-Za-z0-9._-]+/|/home/[A-Za-z0-9._-]+/(celagent|celld)|ALTAK[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{20,}|aws_secret_access_key[[:space:]]*=[[:space:]]*[^[:space:]<$]'
          if "${SCAN[@]}" -E "$PATTERN" .; then
            echo "::error::Secret/PII scan failed — 命中敏感模式"
            exit 1
          fi
          echo "OK: secret/PII scan clean"
      - name: Shell syntax check
        run: |
          bash -n install.sh setup.sh scripts/*.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Package check (npm pack dry-run)
        run: npm pack --dry-run
