name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # The release is built on 22.04 for glibc compatibility; test there too.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig1-dev \
            libfreetype-dev libssl-dev pkg-config cmake clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --release --locked -p lenslet -p lenslet-ui
      - name: CLI smoke test
        run: |
          ./target/release/lenslet --version
          ./target/release/lenslet run -- true 2>&1 | tee smoke.txt || true
          grep -q "no emulator credentials\|emulator CA" smoke.txt

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --release --locked -p lenslet -p lenslet-ui
      - name: Package macOS app
        run: bash scripts/package-macos.sh 0.0.0-ci dist
