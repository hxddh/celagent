name: Lenslet Release

on:
  push:
    tags: ['lenslet-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing lenslet-v* tag to publish'
        required: true
        default: 'lenslet-v1.0.0'

permissions:
  contents: write

concurrency:
  group: lenslet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig1-dev \
            libfreetype-dev libssl-dev pkg-config cmake clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lenslet -> target
      - name: Test
        working-directory: lenslet
        run: cargo test --workspace --locked
      - name: Build release binaries
        working-directory: lenslet
        run: cargo build --release --locked -p lenslet -p lenslet-proxy
      - name: Package Linux x86_64
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#lenslet-v}"
          NAME="lenslet-${VERSION}-linux-x86_64"
          mkdir -p "dist/${NAME}"
          cp lenslet/target/release/lenslet lenslet/target/release/lenslet-proxy "dist/${NAME}/"
          cp lenslet/README.md lenslet/RELEASE_NOTES.md lenslet/LICENSE "dist/${NAME}/"
          cp -r lenslet/docs "dist/${NAME}/"
          mkdir -p "dist/${NAME}/assets/fonts"
          cp lenslet/assets/fonts/LICENSE-* "dist/${NAME}/assets/fonts/"
          strip "dist/${NAME}/lenslet" "dist/${NAME}/lenslet-proxy" || true
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > SHA256SUMS)
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: lenslet-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lenslet -> target
      - name: Test
        working-directory: lenslet
        run: cargo test --workspace --locked
      - name: Build release binaries
        working-directory: lenslet
        run: cargo build --release --locked -p lenslet -p lenslet-proxy
      - name: Package macOS app
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          bash lenslet/scripts/package-macos.sh "${TAG#lenslet-v}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: lenslet-macos
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, build-macos]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/lenslet-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lenslet-linux-x86_64
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: lenslet-macos
          path: dist/macos
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#lenslet-v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/linux/* dist/macos/* --clobber
          else
            gh release create "$TAG" dist/linux/* dist/macos/* \
              --title "Lenslet ${VERSION}" \
              --notes-file lenslet/RELEASE_NOTES.md
          fi
          echo "published $TAG"
