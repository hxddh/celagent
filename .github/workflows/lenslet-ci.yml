name: Lenslet CI

on:
  push:
    branches: [main]
    paths:
      - 'lenslet/**'
      - '.github/workflows/lenslet-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lenslet/**'
      - '.github/workflows/lenslet-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lenslet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig1-dev \
            libfreetype-dev libssl-dev pkg-config cmake clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lenslet -> target
      - name: Format check
        working-directory: lenslet
        run: cargo fmt --all -- --check
      - name: Test workspace
        working-directory: lenslet
        run: cargo test --workspace --locked
      - name: Build release binaries
        working-directory: lenslet
        run: cargo build --release --locked -p lenslet -p lenslet-proxy
