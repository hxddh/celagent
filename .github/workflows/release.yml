name: Release

on:
  push:
    tags: ['lenslet-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'lenslet-v* tag to publish (created at the dispatched commit if it does not exist)'
        required: true
        default: 'lenslet-v7.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GPUI_DEPS: >-
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
    libxcb1-dev libvulkan-dev libfontconfig1-dev libfreetype-dev libssl-dev
    pkg-config cmake clang musl-tools

jobs:
  # The commit to build: the tag's, or (dispatch with a new tag) the dispatched one.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in lenslet-v[0-9]*) ;; *) echo "not a lenslet-v* tag: $TAG"; exit 1 ;; esac
          if ! SHA=$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha 2>/dev/null); then
            SHA="${GITHUB_SHA}"   # new tag: release the dispatched commit
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha: $SHA"; exit 1; }
          echo "building ${TAG} at ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  linux:
    needs: resolve
    strategy:
      matrix:
        # 22.04: the binaries need the glibc they were built with.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - run: sudo apt-get update && sudo apt-get install -y $GPUI_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add "$(uname -m)-unknown-linux-musl"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p lenslet -p lenslet-ui
      - run: cargo build --release --locked -p lenslet --target "$(uname -m)-unknown-linux-musl"
      - name: Package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: bash scripts/package-linux.sh "${TAG#lenslet-v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin -p lenslet -p lenslet-ui
      - run: cargo build --release --locked --target x86_64-apple-darwin -p lenslet -p lenslet-ui
      - name: Package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: bash scripts/package-macos.sh "${TAG#lenslet-v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG#lenslet-v}"
          cp install.sh dist/install.sh
          cd dist
          sha256sum *.tar.gz *.dmg install.sh > SHA256SUMS
          cat SHA256SUMS
          FILES=(*.tar.gz *.dmg install.sh SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "$SHA" \
              --title "Lenslet ${VERSION}" \
              --notes-file ../RELEASE_NOTES.md \
              --latest
          fi
          echo "published $TAG"
