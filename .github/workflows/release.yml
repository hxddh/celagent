name: Release

on:
  push:
    tags: ['lenslet-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'lenslet-v* tag to publish (created at the dispatched commit if it does not exist)'
        required: true
        default: 'lenslet-v3.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The commit to build: the tag's, or (dispatch with a new tag) the dispatched one.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in lenslet-v[0-9]*) ;; *) echo "not a lenslet-v* tag: $TAG"; exit 1 ;; esac
          if ! SHA=$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha 2>/dev/null); then
            SHA="${GITHUB_SHA}"   # new tag: release the dispatched commit
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha: $SHA"; exit 1; }
          echo "building ${TAG} at ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    # Oldest supported runner: the binaries need the glibc they were built with.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig1-dev \
            libfreetype-dev libssl-dev pkg-config cmake clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --release --locked -p lenslet -p lenslet-ui
      - name: Package Linux x86_64
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"
          VERSION="${TAG#lenslet-v}"
          NAME="lenslet-${VERSION}-linux-x86_64"
          mkdir -p "dist/${NAME}"
          cp target/release/lenslet target/release/lenslet-ui "dist/${NAME}/"
          cp README.md RELEASE_NOTES.md LICENSE "dist/${NAME}/"
          cp -r docs "dist/${NAME}/"
          mkdir -p "dist/${NAME}/assets/fonts"
          cp assets/fonts/LICENSE-* "dist/${NAME}/assets/fonts/"
          strip "dist/${NAME}/lenslet" "dist/${NAME}/lenslet-ui" || true
          # Record the glibc floor so a too-new build is caught here, not by users.
          for bin in lenslet lenslet-ui; do
            FLOOR=$(objdump -T "dist/${NAME}/${bin}" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
            echo "${bin} needs ${FLOOR}"
            test "$(printf '%s\n' "${FLOOR}" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35
          done
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > SHA256SUMS)
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: lenslet-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --release --locked -p lenslet -p lenslet-ui
      - name: Package macOS app
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          bash scripts/package-macos.sh "${TAG#lenslet-v}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: lenslet-macos
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-macos
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, build, build-macos]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/lenslet-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: lenslet-linux-x86_64
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: lenslet-macos
          path: dist/macos
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG#lenslet-v}"
          FILES=(dist/linux/*.tar.gz dist/linux/SHA256SUMS dist/macos/*.tar.gz dist/macos/SHA256SUMS-macos)
          ls -lh "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "$SHA" \
              --title "Lenslet ${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
          echo "published $TAG"
